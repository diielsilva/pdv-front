<p-panel header="Confirmar Venda" styleClass="mt-2">
  <form [formGroup]="form">
    <p-inputNumber
      inputId="integeronly"
      formControlName="discount"
      placeholder="Desconto (%)"
      styleClass="w-full mb-2"
      [min]="0"
      [max]="100"
      class="w-full"
    ></p-inputNumber>
    <p-dropdown
      formControlName="paymentMethod"
      placeholder="Forma de Pagamento"
      [options]="paymentOptions"
      styleClass="w-full mb-2"
    ></p-dropdown>
    <div class="flex flex-row justify-content-center align-items-center">
      <div class="m-2">
        <p-inputSwitch
          formControlName="isOnline"
          (onChange)="handleOnlineSaleSwitchButton()"
        />
        <span class="ml-1">Venda Online</span>
      </div>
      @if (form.controls['isOnline'].value) {
      <div class="m-2">
        <p-inputSwitch formControlName="hasDelivery" />
        <span class="ml-1">Possui Entrega</span>
      </div>
      }
    </div>
    <p-button
      label="Confirmar"
      (onClick)="confirm()"
      [rounded]="true"
      [disabled]="loadingHelper.isLoading() || form.invalid"
      styleClass="w-full cursor-pointer"
    ></p-button>
  </form>
</p-panel>
